modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Black-Moss/Thaumaturge-Tweaks/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Black_Moss"
description = "${mod_description}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/thaumaturge-tweaks"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "thaumaturge"
type = "required"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "rei"
type = "optional"
versionRange = "[26.1.819,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "curios"
type = "optional"
ordering = "AFTER"
side = "BOTH"
